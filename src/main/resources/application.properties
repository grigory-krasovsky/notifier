spring.application.name=Notifier

# Datasource: defaults match docker-compose.yml; override via env elsewhere
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/notifier}
spring.datasource.username=${DB_USERNAME:notifier}
spring.datasource.password=${DB_PASSWORD:notifier}

# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only validates
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Telegram bot token comes from the environment only - never commit it (see .env.example)
notifier.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
